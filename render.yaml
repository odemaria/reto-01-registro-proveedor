# Despliegue en Render (https://render.com): New → Blueprint → seleccionar este repositorio.
# Los valores marcados con sync: false se ingresan a mano en el panel de Render y NO quedan en el repo.
services:
  - type: web
    name: reto-01-registro-proveedor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: FECHA_REFERENCIA
        value: "2026-09-03"
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "400000"
      - key: MAX_MENSAJES_POR_MINUTO
        value: "20"
